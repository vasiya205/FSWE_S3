server:
  port: 8080
spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - http://localhost:5173
              - http://127.0.0.1:5173
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders:
              - "*"
            maxAge: 3600
      routes:
        - id: auth-route
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
        - id: tutor-route
          uri: http://localhost:8082
          predicates:
            - Path=/api/tutors/**
        - id: booking-route
          uri: http://localhost:8083
          predicates:
            - Path=/api/bookings/**, /api/reviews/**, /api/admin/bookings/**

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
